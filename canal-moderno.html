<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grupo Modelo | Canal Moderno</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="overlay"></div>
<nav class="menu-abinbev">

    <div class="menu-logo">

        AB InBev

    </div>

    <div class="menu-links" id="menuLinks">

        <a href="index.html" >
            Inicio
        </a>

        <a href="canal-moderno.html"  class="active">
            Canal Moderno
        </a>

        <a href="reparacion.html">
            Reparación
        </a>

    </div>

    <div class="menu-toggle" id="menuToggle">

        ☰

    </div>

</nav>

<div class="container">

    <div class="header">

        <div>

            <h1>CANAL MODERNO</h1>

            <p>VALIDACIÓN DE FRESCURA · GRUPO MODELO</p>

        </div>

        <div class="logo">
            MODERNO
        </div>

    </div>

    <div class="card">

        

        <div class="input-group">

            <label>SKU</label>

            <input
                list="skuList"
                id="skuInput"
                placeholder="Escribe o selecciona SKU"
            >

            <datalist id="skuList"></datalist>

        </div>

        <div class="input-group">

            <label>LOTE</label>

            <input
                type="text"
                id="lote"
                placeholder="Ejemplo: D106"
                maxlength="5"
            >

        </div>

                <div class="input-group">

                    <label>CADENA</label>

                    <select id="cediSelect" class="custom-select">

                        <option value="">
                            Selecciona cadena
                        </option>

                    </select>

                </div>

                <button onclick="validarCanalModerno()">
            ANALIZAR PRODUCTO
        </button>

        </div>

        

    

    <div class="resultado" id="resultado">

        <h2>RESULTADO</h2>

        <div class="grid">

            <div class="info">
                <span>CADENA</span>
                <strong id="cadena"></strong>
            </div>


            <div class="info">
                <span>DÍAS TRANSCURRIDOS</span>
                <strong id="dias"></strong>
            </div>

            <div class="info">

                <span>VIDA RESTANTE</span>

                <strong id="vidaRestante"></strong>

            </div>

            <div class="info">
                <span>DÍAS DE ACEPTACIÓN</span>
                <strong id="diasAceptacion"></strong>
            </div>

            <div class="info">
                <span>PORCENTAJE DE VIDA</span>
                <strong id="porcentaje"></strong>
            </div>

        </div>

        <div class="estatus" id="estatus"></div>

    </div>

    </div>

<script src="canal-moderno.js"></script>


<script>

document.addEventListener("DOMContentLoaded",()=>{

    const menuToggle =
    document.querySelector(".menu-toggle");

    const menuLinks =
    document.querySelector(".menu-links");

    if(menuToggle && menuLinks){

        menuToggle.addEventListener("click",()=>{

            menuLinks.classList.toggle("show");

        });

    }

});

</script>

</body>
</html>
